name: 问题反馈
description: 请提供可复现步骤和相机版本
body:
  - type: input
    id: version
    attributes:
      label: 应用版本、相机型号与固件
      placeholder: v0.9.0-beta.1 / A6300 / 2.01
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与实际结果
      description: 从哪个页面开始？按了什么键？屏幕最后显示什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可提供 LUT 阶数、预览模式、SD 卡型号或脱敏日志；不要提交密码、私人照片或未经授权的 LUT。
